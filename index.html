<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3E2723">
<title>FAT Café · NESCAFÉ Plan</title>
<style>
:root{
  --cafe:#3E2723;--cafe2:#5D4037;--creme:#C8A27A;--areia:#F5F1EC;--papel:#fff;
  --tinta:#1F1A17;--fraco:#6E635C;--linha:#E4DDD5;--ok:#2E7D32;--alerta:#B26A00;
  --erro:#B3261E;--folha:#4C6B3C;--r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--areia);color:var(--tinta);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h2{font-size:15px;letter-spacing:.02em;text-transform:uppercase;color:var(--cafe2);margin:0 0 10px}
.tela{display:none}.tela.on{display:block}

/* login */
.loginWrap{min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%,#6D4C41 0%,#3E2723 55%,#2A1A16 100%)}
.loginCard{width:100%;max-width:392px;background:var(--papel);border-radius:16px;padding:30px 26px 22px;
  box-shadow:0 24px 60px rgba(0,0,0,.34)}
.brand{display:flex;gap:13px;align-items:center;margin-bottom:24px}
.brand strong{display:block;font-size:19px;color:var(--cafe)}
.brand span{font-size:12px;color:var(--fraco)}
.chkLine{display:flex;gap:9px;align-items:center;font-size:13.5px;color:var(--fraco);margin:12px 0 4px}
.erroBox{display:none;background:#FDECEA;color:var(--erro);padding:10px 12px;border-radius:8px;
  font-size:13.5px;margin:10px 0 0;line-height:1.5}
.erroBox.on{display:block}
.fine{font-size:11.5px;color:var(--fraco);line-height:1.55;margin:18px 0 0;
  border-top:1px solid var(--linha);padding-top:14px}

/* estrutura */
.top{position:sticky;top:0;z-index:20;background:var(--cafe);color:#fff;display:flex;
  align-items:center;gap:14px;padding:11px 18px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.tLeft{display:flex;align-items:baseline;gap:9px}
.tLeft strong{font-size:16px}.tLeft span{font-size:11px;opacity:.65}
.tRight{margin-left:auto;display:flex;align-items:center;gap:14px}
.eu{text-align:right;line-height:1.25}
.eu strong{display:block;font-size:13.5px}.eu span{font-size:11px;opacity:.68}
.fzHead{line-height:1.25;min-width:0}
.fzHead strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fzHead span{font-size:11.5px;opacity:.7}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 64px}
.wrap.form{max-width:800px}
.cols{display:grid;grid-template-columns:352px 1fr;gap:22px;align-items:start}

/* botoes */
.primary{background:var(--cafe);color:#fff;border-radius:var(--r);padding:12px 18px;font-weight:600}
.primary:hover{background:var(--cafe2)}
.primary:disabled{opacity:.6;cursor:wait}
.ghost{border:1px solid var(--linha);background:var(--papel);border-radius:var(--r);padding:9px 14px;color:var(--cafe2)}
.ghost:hover{border-color:var(--creme)}
.block{display:block;width:100%;margin-top:10px}
.sm{padding:7px 11px;font-size:13px;border-radius:8px}
button.sm:not(.ghost){background:var(--cafe);color:#fff}
.danger{color:var(--erro)}
.arquivo{position:relative;overflow:hidden;display:inline-block;text-align:center}
.arquivo input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* campos */
.cp{display:block;margin-bottom:13px}
.cp>span{display:block;font-size:11.5px;color:var(--fraco);margin-bottom:5px}
.cp>span i{color:var(--erro);font-style:normal}
.cp input,.cp select,.txt{width:100%;padding:11px 12px;border:1px solid var(--linha);
  border-radius:9px;background:var(--papel);min-height:44px}
.cp input:focus,.cp select:focus,.txt:focus{outline:2px solid var(--creme);outline-offset:-1px}
.unFixa{background:var(--areia)!important;color:var(--fraco);cursor:default}
.busca{width:100%;padding:11px 13px;border:1px solid var(--linha);border-radius:9px;
  margin-bottom:11px;min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* fazendas */
.listaFaz{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.cardFaz{display:block;width:100%;text-align:left;background:var(--papel);
  border:1px solid var(--linha);border-radius:var(--r);padding:12px 13px}
.cardFaz:hover{border-color:var(--creme)}
.cardFaz.bloq{opacity:.62}
.fzNome{display:block;font-weight:600;font-size:14px;color:var(--cafe)}
.fzProd{display:block;font-size:12.5px;margin-top:1px}
.fzMeta{display:block;font-size:11.5px;color:var(--fraco);margin-top:2px}
.fzTags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.fzTags em{font-style:normal;font-size:10px;background:var(--areia);color:var(--fraco);
  padding:2px 7px;border-radius:20px;border:1px solid var(--linha)}
.tagBloq{background:#FDECEA!important;color:var(--erro)!important}
.tagLivre{font-style:normal;background:#EEF3E9;color:var(--folha);padding:1px 6px;
  border-radius:12px;font-size:10.5px}

/* lancamentos */
.contadores{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.contadores button{border:1px solid var(--linha);background:var(--papel);border-radius:20px;
  padding:7px 13px;font-size:13px;color:var(--fraco)}
.contadores button.on{background:var(--cafe);color:#fff;border-color:var(--cafe)}
.contadores b{margin-left:5px;font-size:12px}
.barraSel{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px}
.barraSel span{font-size:12.5px;color:var(--fraco);margin-right:auto}
.listaLanc{display:flex;flex-direction:column;gap:8px}
.lanc{display:grid;grid-template-columns:34px 1fr 78px 104px;gap:11px;align-items:center;
  background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);padding:12px}
.lcInfo strong{display:block;font-size:14px;color:var(--cafe)}
.lcInfo span{display:block;font-size:12px;color:var(--fraco)}
.lcRes{text-align:right}
.lcRes b{display:block;font-size:17px;color:var(--cafe)}
.lcRes span{font-size:11px;color:var(--fraco)}
.badge{font-size:10.5px;padding:4px 9px;border-radius:20px;text-align:center;white-space:nowrap}
.b-rascunho{background:#F0EDE9;color:var(--fraco)}
.b-com_pendencia{background:#FFF4E0;color:var(--alerta)}
.b-concluido{background:#E9F3EA;color:var(--ok)}
.b-exportado{background:#E8EFF7;color:#1E5A96}
.lcAcoes{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;
  border-top:1px solid var(--linha);padding-top:9px}
.lcAcoes button{font-size:12.5px;padding:7px 11px;border-radius:7px;border:1px solid var(--linha);
  background:var(--papel);color:var(--cafe2);min-height:38px}
.chk input{width:20px;height:20px;accent-color:var(--cafe)}
.manut{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;border-top:1px solid var(--linha);padding-top:16px}

/* formulario */
.progresso{height:3px;background:var(--linha)}
.progresso>div{height:100%;background:var(--folha);transition:width .3s}
.progTxt{max-width:800px;margin:7px auto 0;padding:0 18px;font-size:11.5px;color:var(--fraco)}
.abas{position:sticky;top:49px;z-index:10;display:flex;gap:6px;overflow-x:auto;padding:11px 18px;
  background:var(--areia);border-bottom:1px solid var(--linha);scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{white-space:nowrap;padding:9px 15px;border-radius:20px;font-size:13.5px;color:var(--fraco);
  background:var(--papel);border:1px solid var(--linha);min-height:40px}
.aba.on{background:var(--cafe);color:#fff;border-color:var(--cafe)}
.sub{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--cafe2);
  margin:26px 0 12px;padding-bottom:7px;border-bottom:2px solid var(--creme)}
.campo{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);
  padding:15px;margin-bottom:11px}
.cbHead{display:flex;gap:10px;align-items:flex-start}
.cod{font-size:11px;font-weight:700;color:var(--creme);background:var(--cafe);
  padding:3px 8px;border-radius:5px;flex:0 0 auto}
.perg{margin:0;font-size:14px;line-height:1.45;flex:1}
.pts{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;
  background:#E9F3EA;color:var(--ok);flex:0 0 auto}
.pts.na{background:#F0EDE9;color:var(--fraco)}
.obs{margin:8px 0 0;font-size:12px;color:var(--alerta);background:#FFF8EC;padding:8px 10px;border-radius:7px}
.help{margin:8px 0 0;font-size:11.5px;color:var(--fraco);font-style:italic}
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.op{padding:11px 16px;border:1.5px solid var(--linha);border-radius:9px;background:var(--papel);
  font-size:14px;min-height:46px}
.op:hover{border-color:var(--creme)}
.op.on{background:var(--cafe);color:#fff;border-color:var(--cafe);font-weight:600}
.numBox{display:flex;align-items:center;gap:9px;margin-top:12px}
.numBox input{flex:1;padding:12px;border:1px solid var(--linha);border-radius:9px;
  min-height:46px;font-size:16px}
.un{font-size:12.5px;color:var(--fraco);white-space:nowrap}
.calcBox{margin-top:12px;background:var(--areia);border:1px dashed var(--linha);border-radius:9px;
  padding:13px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.calcBox strong{font-size:20px;color:var(--cafe)}
.calcBox em{color:var(--fraco);font-size:13px}
.lock{margin-left:auto;font-size:10.5px;color:var(--fraco);text-transform:uppercase}
.upBox{margin-top:12px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.fileOk{font-size:12.5px;color:var(--ok)}.fileNo{font-size:12.5px;color:var(--fraco)}
.msg{margin:10px 0 0;font-size:12.5px;padding:9px 11px;border-radius:7px;line-height:1.45}
.msg.erro{background:#FDECEA;color:var(--erro)}
.msg.alerta{background:#FFF4E0;color:var(--alerta)}
.msg.info{background:#EEF3F8;color:#1E5A96}
.navForm{display:flex;gap:11px;justify-content:space-between;margin-top:26px}
.navForm button{flex:1;min-height:50px}
.grupoTit{background:linear-gradient(90deg,var(--cafe),var(--cafe2));color:#fff;
  padding:13px 15px;border-radius:var(--r);margin:18px 0 11px}
.grupoTit strong{display:block;font-size:14px}
.grupoTit span{display:block;font-size:11.5px;opacity:.78;margin-top:3px}
.fichaV{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--papel);
  border:1px solid var(--linha);border-radius:var(--r);padding:16px}
.fichaV span{display:block;font-size:10.5px;color:var(--fraco);text-transform:uppercase}
.fichaV strong{font-size:13.5px}
.nota{font-size:11.5px;color:var(--fraco);background:var(--areia);padding:9px 11px;
  border-radius:7px;border-left:3px solid var(--creme);margin:11px 0}

/* repetidor */
.repeater{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);
  padding:15px;margin-bottom:12px}
.repHead strong{display:block;font-size:14px;color:var(--cafe)}
.repHead span{display:block;font-size:11.5px;color:var(--fraco);margin:3px 0 13px}
.fertCard{border:1px solid var(--linha);border-radius:9px;padding:13px;margin-bottom:10px;background:var(--areia)}
.fcTop{display:flex;align-items:center;margin-bottom:10px}
.fcTop span{font-size:11.5px;font-weight:600;color:var(--cafe2);text-transform:uppercase}
.rm{margin-left:auto;font-size:12px;color:var(--erro);padding:5px 9px;border-radius:6px;min-height:34px}
.fcGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 11px}
.cp.wide{grid-column:1/-1}
.addFert{width:100%;padding:13px;border:1.5px dashed var(--creme);border-radius:9px;
  color:var(--cafe2);font-size:13.5px;min-height:48px}
.fertRes{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:14px;
  background:var(--cafe);border-radius:9px;padding:13px}
.fertRes div{text-align:center}
.fertRes span{display:block;font-size:10px;color:var(--creme);text-transform:uppercase}
.fertRes strong{display:block;font-size:16px;color:#fff;margin-top:3px}

/* resumo */
.resTopo{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:16px}
.resTopo>div{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);
  padding:16px;text-align:center}
.resTopo span{display:block;font-size:10.5px;color:var(--fraco);text-transform:uppercase}
.resTopo strong{display:block;font-size:25px;color:var(--cafe);margin-top:5px}
.resTopo .nv.good{background:var(--cafe);border-color:var(--cafe)}
.resTopo .nv.good span{color:var(--creme)}
.resTopo .nv.good strong{color:#fff;font-size:20px}
.resTopo .nv.bad{background:#FDECEA}
.resTopo .nv.bad strong{color:var(--erro);font-size:18px}
.criterios,.valBox{background:var(--papel);border:1px solid var(--linha);
  border-radius:var(--r);padding:16px;margin-bottom:14px}
.criterios .sub,.valBox .sub{margin-top:0}
.cOk,.cNo{margin:0 0 9px;font-size:13px;line-height:1.5}
.cOk{color:var(--ok)}.cNo{color:var(--erro)}
.cOk em,.cNo em{color:var(--fraco);font-size:11px;font-style:normal}
.alertaLinha input{width:100%;margin:6px 0 14px;padding:9px 11px;
  border:1px solid var(--linha);border-radius:7px;min-height:42px}
.trilha{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);
  padding:14px 16px;margin-bottom:16px}
.trilha summary{cursor:pointer;font-size:13px;color:var(--cafe2);font-weight:600}
.trilha table{width:100%;border-collapse:collapse;margin-top:12px;font-size:11.5px}
.trilha th{text-align:left;color:var(--fraco);padding:5px 7px;border-bottom:1px solid var(--linha)}
.trilha td{padding:5px 7px;border-bottom:1px solid var(--areia)}
.t-pendente{background:#FFFCF5}.t-na{color:var(--fraco)}
.resAcoes{display:flex;gap:10px;flex-wrap:wrap}
.resAcoes button{flex:1;min-width:150px;min-height:50px;border:1px solid var(--linha);
  background:var(--papel);border-radius:var(--r);color:var(--cafe2)}
.resAcoes .primary{border-color:var(--cafe);color:#fff}
.vazio{font-size:13px;color:var(--fraco);background:var(--papel);border:1px dashed var(--linha);
  border-radius:var(--r);padding:20px;text-align:center;line-height:1.6}
.prog{display:none;background:var(--papel);border:1px solid var(--linha);
  border-radius:var(--r);padding:13px;margin-bottom:11px}
.prog.on{display:block}
.prog>div{height:5px;background:var(--folha);border-radius:3px;width:0;transition:width .2s}
.prog span{display:block;font-size:11.5px;color:var(--fraco);margin-top:7px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,160%);background:var(--cafe);
  color:#fff;padding:13px 20px;border-radius:9px;font-size:13.5px;
  box-shadow:0 10px 30px rgba(0,0,0,.28);transition:transform .3s;z-index:90;max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.toast.erro{background:var(--erro)}.toast.alerta{background:var(--alerta)}

/* impressao / PDF */
#printArea{display:none}
@media print{
  body{background:#fff}
  .tela,.top,.abas,.navForm,.toast,.manut,.barraSel,.progresso,.progTxt{display:none!important}
  #printArea{display:block!important}
  @page{size:A4;margin:14mm 12mm}
  .rel{page-break-after:always;font-size:10pt;color:#1F1A17}
  .rel:last-child{page-break-after:auto}
  .relTop{border-bottom:2.5px solid #3E2723;padding-bottom:7px;margin-bottom:11px}
  .relTop h1{font-size:14pt;margin:0;color:#3E2723}
  .relTop p{margin:2px 0 0;font-size:8.5pt;color:#6E635C}
  .relFicha{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px 14px;margin-bottom:11px}
  .relFicha div{font-size:8.5pt}
  .relFicha b{display:block;font-size:6.8pt;color:#6E635C;text-transform:uppercase;font-weight:600}
  .relRes{display:flex;gap:16px;background:#F5F1EC;padding:9px 12px;
    border-left:3.5px solid #3E2723;margin-bottom:11px}
  .relRes div{font-size:8pt;color:#6E635C}
  .relRes strong{display:block;font-size:14pt;color:#3E2723}
  .rel h2{font-size:9pt;text-transform:uppercase;background:#3E2723;color:#fff;
    padding:4px 8px;margin:12px 0 6px;page-break-after:avoid}
  .rel table{width:100%;border-collapse:collapse;font-size:8.5pt}
  .rel th{text-align:left;font-size:7pt;color:#6E635C;border-bottom:1px solid #C8A27A;padding:3px 5px}
  .rel td{padding:3px 5px;border-bottom:.5px solid #E4DDD5;vertical-align:top}
  .rel tr{page-break-inside:avoid}
  .qC{width:34px;font-weight:700;color:#5D4037}
  .qV{width:120px;font-weight:700;color:#3E2723}
  .qP{width:34px;text-align:right;color:#6E635C}
  .relCrit li{font-size:8.5pt;margin-bottom:2px}
  .relCrit .no{color:#B3261E}.relCrit .si{color:#2E7D32}
  .relFoot{margin-top:12px;padding-top:6px;border-top:.5px solid #E4DDD5;
    font-size:7pt;color:#6E635C;display:flex;justify-content:space-between}
}

@media(max-width:900px){
  .cols{grid-template-columns:1fr}.listaFaz{max-height:none}
  .fertRes{grid-template-columns:repeat(2,1fr)}
  .resTopo,.grid2,.fichaV{grid-template-columns:1fr}
}
@media(max-width:560px){
  .wrap{padding:16px 13px 56px}
  .lanc{grid-template-columns:30px 1fr;gap:9px}
  .lcRes{grid-column:2;text-align:left;display:flex;gap:9px;align-items:baseline}
  .lcRes b{font-size:15px}
  .badge{grid-column:2;justify-self:start}
  .fcGrid{grid-template-columns:1fr 1fr}
  .abas{top:47px}.top{padding:10px 13px}.eu{display:none}
}
</style>
</head>
<body>

<section class="tela on" id="login">
  <div class="loginWrap"><div class="loginCard">
    <div class="brand">
      <svg viewBox="0 0 48 48" width="40" height="40">
        <path d="M24 6c-7 0-12 5-12 11 0 7 5 11 12 19 7-8 12-12 12-19 0-6-5-11-12-11z"
          fill="none" stroke="#C8A27A" stroke-width="2.4"/>
        <path d="M24 12c-3.6 3-3.6 9 0 18 3.6-9 3.6-15 0-18z" fill="#C8A27A"/>
      </svg>
      <div><strong>FAT Café</strong><span>v2.1 · aplicação de campo</span></div>
    </div>
    <form id="formLogin" autocomplete="off">
      <label class="cp"><span>Usuário</span>
        <input id="inUser" placeholder="NOME.SOBRENOME" autocapitalize="characters" required></label>
      <label class="cp"><span>Senha</span><input id="inSenha" type="password" required></label>
      <label class="chkLine"><input type="checkbox" id="inManter"> Manter sessão neste aparelho</label>
      <p class="erroBox" id="loginErro"></p>
      <button class="primary block" type="submit">Entrar</button>
    </form>
    <p class="fine">Funciona integralmente offline, em arquivo único. As credenciais ficam
    protegidas dentro do próprio aplicativo — proteção adequada ao uso em campo, porém
    <strong>não equivalente à autenticação em servidor</strong>.</p>
  </div></div>
</section>

<section class="tela" id="painel">
  <header class="top">
    <div class="tLeft"><strong>FAT Café</strong><span id="verForm"></span></div>
    <div class="tRight">
      <div class="eu"><strong id="quemSou"></strong><span id="meuPapel"></span></div>
      <button id="btnSair" class="ghost">Sair</button>
    </div>
  </header>
  <main class="wrap"><div class="cols">
    <div class="colA">
      <h2>Fazendas vinculadas</h2>
      <input id="buscaFazenda" class="busca" placeholder="Buscar fazenda, produtor, município ou código">
      <div id="listaFazendas" class="listaFaz"></div>
      <button id="btnNovoLivre" class="ghost block">+ Nova avaliação (entrada livre)</button>
    </div>
    <div class="colB">
      <h2>Lançamentos</h2>

var BY_ID = {}, SCORABLE = [];
ITEMS.forEach(function (i) { BY_ID[i.id] = i; if (i.pontua) SCORABLE.push(i); });
var MAX_SCORE = SCORABLE.length;   /* 28 */

/* Gates literais da aba FORM */
var GATE_ZERA = { q104:['q105','q106','q107','q108'] };
var GATE_NA   = { q301:['q303','q305','q307'], q302:['q304','q306','q308'], q309:['q310','q311'] };

/* ==========================================================================
   5. MOTOR DE CÁLCULO
   ========================================================================== */
function num(v) {
  if (v === null || v === undefined || v === '') return null;
  var n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.'));
  return isFinite(n) ? n : null;
}
function round(v, c) {
  if (v === null || v === undefined || !isFinite(v)) return null;
  var f = Math.pow(10, c);
  return Math.round((v + Number.EPSILON) * f) / f;
}

function ponderarNPK(fs) {
  fs = fs || [];
  var linhas = fs.filter(function (f) { var q = num(f.quantidade); return q !== null && q > 0; });
  var somaQ = linhas.reduce(function (a, f) { return a + num(f.quantidade); }, 0);

  if (!linhas.length || somaQ <= 0) {
    return { nPond:null, pPond:null, kPond:null, massaN:0, massaP:0, massaK:0,
             baseN:0, baseP:0, baseK:0, pElementar:null, kElementar:null,
             qtdTotal: somaQ || 0, fertPrincipal:null,
             linhasValidas:0, motivo: fs.length ? 'quantidade_total_zero' : 'sem_linhas' };
  }
  /* Ponderacao POR NUTRIENTE PRESENTE: cada nutriente e ponderado apenas entre os
     fertilizantes que efetivamente o contem (teor > 0). Assim o volume de um
     produto sem aquele nutriente (ex.: KCl, que nao tem N) nao dilui o teor dos
     demais. Retorna tambem a MASSA de nutriente, usada nos calculos por hectare. */
  function nutriente(campo) {
    var massa = 0, base = 0;
    linhas.forEach(function (f) {
      var t = num(f[campo]);
      if (t === null || t <= 0) return;          /* ausente ou zero nao entra */
      massa += num(f.quantidade) * t / 100;      /* kg do nutriente */
      base  += num(f.quantidade);                /* kg de produto que o contem */
    });
    return { massa: massa, base: base, teor: base > 0 ? (massa / base * 100) : null };
  }
  var N = nutriente('n'), P = nutriente('p'), K = nutriente('k');
  var principal = linhas.slice().sort(function (a, b) {
    var dn = (num(b.n) === null ? -1 : num(b.n)) - (num(a.n) === null ? -1 : num(a.n));
    return dn !== 0 ? dn : (num(b.quantidade) - num(a.quantidade));
  })[0];
  return {
    nPond: round(N.teor, AS.arred.npk),
    pPond: round(P.teor, AS.arred.npk),
    kPond: round(K.teor, AS.arred.npk),
    massaN: round(N.massa, 2), massaP: round(P.massa, 2), massaK: round(K.massa, 2),
    baseN: round(N.base, 2), baseP: round(P.base, 2), baseK: round(K.base, 2),
    pElementar: round(P.teor === null ? null : P.teor * AS.formaPK.fatorP, AS.arred.npk),
    kElementar: round(K.teor === null ? null : K.teor * AS.formaPK.fatorK, AS.arred.npk),
    qtdTotal: round(somaQ, 2),
    fertPrincipal: principal ? String(principal.nome || '').trim() : null,
    linhasValidas: linhas.length, motivo: null
  };
}

function calcular(resp, fs) {
  var npk = ponderarNPK(fs), o = {};
  o.nPond = npk.nPond; o.pPond = npk.pPond; o.kPond = npk.kPond;
  o.pElementar = npk.pElementar; o.kElementar = npk.kElementar;
  o.qtdTotal = npk.qtdTotal; o.fertPrincipal = npk.fertPrincipal;
  o.npkMotivo = npk.motivo; o.npkLinhas = npk.linhasValidas;
  o.massaN = npk.massaN; o.massaP = npk.massaP; o.massaK = npk.massaK;

  var org = num(resp.q110a), tot = num(resp.q110b);
  o.pctOrganico = (org !== null && tot !== null && tot > 0)
    ? round(org / tot * 100, AS.arred.pct) : null;

  var ha = num(resp.q111ha), rend = num(resp.q111y);
  /* N por hectare vem da MASSA total de N aplicada, nao do teor ponderado —
     o teor agora e a media apenas entre os produtos que contem N. */
  o.nAplicadoHa = (npk.massaN > 0 && ha && ha > 0)
    ? round(npk.massaN / ha, AS.arred.pn) : null;

  o.semNsintetico = (npk.qtdTotal === 0) || !(npk.massaN > 0);
  o.pn = (!o.semNsintetico && o.nAplicadoHa && o.nAplicadoHa > 0 && rend !== null)
    ? round(rend / o.nAplicadoHa, AS.arred.pn) : null;

  o.areaProducao = ha;
  var kgTotal = (rend !== null && ha !== null) ? rend * ha : null;
  o.producaoSacas = kgTotal === null ? null
    : round(AS.sacas.valor === 'dividir' ? kgTotal / AS.sacas.kgPorSaca : kgTotal * AS.sacas.kgPorSaca, 2);
  o.produtividadeScHa = (o.producaoSacas !== null && ha && ha > 0)
    ? round(o.producaoSacas / ha, 2) : null;
  o.sacasForaDaFaixa = o.produtividadeScHa !== null &&
    (o.produtividadeScHa < AS.sacas.sanidade.min || o.produtividadeScHa > AS.sacas.sanidade.max);

  /* Calculadora auxiliar de 3.05 — uso de agua na irrigacao (m3/ha/ano).
     Litros = vazao (L/h) x n de emissores x tempo por rega (h) x dias de irrigacao.
     m3/ha/ano = (Litros / 1000) / area irrigada (ha). */
  var vz = num(resp.irrVazao), em = num(resp.irrEmissores),
      tp = num(resp.irrHoras),  di = num(resp.irrDias),
      ai = num(resp.irrArea);
  if (ai === null || ai <= 0) ai = ha;                 /* padrao: area de cafe */
  o.irrAreaUsada = ai;
  o.irrLitrosAno = (vz > 0 && em > 0 && tp > 0 && di > 0) ? vz * em * tp * di : null;
  o.irrM3Ano = o.irrLitrosAno === null ? null : round(o.irrLitrosAno / 1000, 2);
  o.aguaIrrigacao = (o.irrM3Ano !== null && ai && ai > 0)
    ? round(o.irrM3Ano / ai, 2) : null;
  return o;
}

/* ==========================================================================
   6. MOTOR DE PONTUAÇÃO
   ========================================================================== */
function aplicarRegra(score, valor) {
  if (!score) return null;
  if (score.kind === 'map') {
    var v = String(valor);
    return Object.prototype.hasOwnProperty.call(score.map, v) ? score.map[v] : null;
  }
  var n = num(valor), i, f, okMin, okMax;
  if (n === null) return null;
  for (i = 0; i < score.r.length; i++) {
    f = score.r[i];
    okMin = f[0] === null || (f[2] ? n >= f[0] : n > f[0]);
    okMax = f[1] === null || (f[3] ? n <= f[1] : n < f[1]);
    if (okMin && okMax) return f[4];
  }
  return null;
}

function pontuar(resp, calc) {
  var st = {}, pontos = 0, maximo = 0, pendentes = [], nas = [], trilha = [];
  var zerados = {}, naSet = {};

  Object.keys(GATE_ZERA).forEach(function (g) {
    if (resp[g] === 'Não') GATE_ZERA[g].forEach(function (a) { zerados[a] = g; });
  });
  Object.keys(GATE_NA).forEach(function (g) {
    if (resp[g] === 'Não') GATE_NA[g].forEach(function (a) { naSet[a] = g; });
  });

  SCORABLE.forEach(function (item) {
    var id = item.id, valor, pts;

    if (zerados[id]) {
      st[id] = { estado:'zerado', pontos:0,
                 regra: BY_ID[zerados[id]].code + ' = Não → "Sem análise = 0"' };
      maximo += 1; pontos += 0;
      trilha.push({ id:id, code:item.code, secao:item.section, estado:'zerado', pontos:0, regra:st[id].regra });
      return;
    }
    if (naSet[id]) {
      st[id] = { estado:'na', pontos:null,
                 regra: BY_ID[naSet[id]].code + ' = Não → NA (sem pontuação)' };
      nas.push(item.code);
      trilha.push({ id:id, code:item.code, secao:item.section, estado:'na', pontos:null, regra:st[id].regra });
      return;
    }

    if (item.type === 'calc') {
      valor = item.formula === 'pctOrganico' ? calc.pctOrganico
            : item.formula === 'pn' ? calc.pn : null;
      if (item.id === 'q111pn' && calc.semNsintetico) {
        st[id] = { estado:'pontuado', pontos:item.scoreEspecial.semN,
                   regra:'0 (nenhum N sintético aplicado) = 1' };

  function set(L, cell) { row[colIndex(L) - 1] = cell; }

  set('A', cS(reg.codigoExibicao));

  set('J', cS(reg.consultorNome || ''));
  set('K', cS(reg.fotoComprobatoria || ''));

  Object.keys(PORCOL).forEach(function (col) {
    var item = PORCOL[col], val, estado, raw, a;
    if (IDENT[col]) return;

    if (item.type === 'upload') {
      a = (reg.anexos || []).filter(function (x) { return x.itemId === item.id; })[0];
      set(col, cS(a ? (AS.evidencia.valor === 'SIM_com_nome' ? 'SIM — ' + a.nome : 'SIM') : ''));
      return;
    }
    if (item.type === 'calc') {
      val = item.formula === 'pctOrganico' ? calc.pctOrganico
          : item.formula === 'pn' ? calc.pn
          : item.formula === 'nPond' ? calc.nPond
          : item.formula === 'pPond' ? calc.pPond
          : item.formula === 'kPond' ? calc.kPond
          : item.formula === 'qtdTotal' ? calc.qtdTotal
          : item.formula === 'fertPrincipal' ? calc.fertPrincipal : null;
      set(col, item.formula === 'fertPrincipal' ? cS(val) : cN(val, 2));

  return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>FAT Cafe - Relatorio</title><style>' + REPORT_CSS + '</style></head><body>' +
    regs.map(relatorioHTML).join('') + '</body></html>';
}

function imprimirEmJanela(html) {
  var w = null;
  try { w = window.open('', '_blank'); } catch (e) {}
  if (!w) { aviso('Não foi possível abrir a janela de impressão. Libere pop-ups para este arquivo.','erro'); return; }
  try {
    w.document.open(); w.document.write(html); w.document.close();
    setTimeout(function () { try { w.focus(); w.print(); } catch (e) {} }, 500);
  } catch (e) {
    aviso('Falha ao montar o relatório para impressão.','erro');
  }
}

function imprimirRelatorios(regs) {
  if (!regs || !regs.length) { aviso('Nenhum relatório para gerar.','alerta'); return; }
  var html = docRelatorio(regs), ifr = null, limpo = false;
  function limpar() {
    if (limpo) return; limpo = true;
    setTimeout(function () { if (ifr && ifr.parentNode) ifr.parentNode.removeChild(ifr); }, 400);
  }
  try {
    ifr = document.createElement('iframe');
    ifr.setAttribute('aria-hidden','true');
    ifr.style.cssText = 'position:fixed;right:0;bottom:0;width:210mm;height:297mm;' +
      'border:0;opacity:0;pointer-events:none;z-index:-1';
    document.body.appendChild(ifr);
    var d = ifr.contentWindow.document;
    d.open(); d.write(html); d.close();
    var imprimir = function () {
      try {
        var w = ifr.contentWindow;
        w.onafterprint = limpar;          /* limpa apenas depois da impressao */
        w.focus();
        w.print();
        setTimeout(limpar, 60000);        /* rede de seguranca */
      } catch (e) { limpar(); imprimirEmJanela(html); }
    };
    if (d.readyState === 'complete') setTimeout(imprimir, 300);
    else ifr.onload = function () { setTimeout(imprimir, 300); };
  } catch (e) {
    limpar();
    imprimirEmJanela(html);
  }
}

/* ==========================================================================
   15. BACKUP
   ========================================================================== */
function exportarBackup() {
  var regs = listarRegistros();
  var p = { magic:'FATCOFFEE-BACKUP', v:2, geradoEm:new Date().toISOString(),
            formVersion:FORM_VERSION, assumptionsVersion:ASSUMPTIONS_VERSION,
            totalRegistros:regs.length, records:regs, audit:dbLer(AUD_KEY) };
  p.checksum = sha256(JSON.stringify(regs)).slice(0, 32);
  return new Blob([JSON.stringify(p, null, 1)], { type:'application/json' });
}
function validarBackup(texto) {
  var p;
  try { p = JSON.parse(texto); } catch (e) { return { ok:false, erro:'O arquivo não é um JSON válido.' }; }
  if (p.magic !== 'FATCOFFEE-BACKUP') return { ok:false, erro:'Este arquivo não é um backup do aplicativo FAT.' };
  if (!p.records || !p.records.length && !Array.isArray(p.records))
    return { ok:false, erro:'O backup não contém a lista de lançamentos.' };
  if (p.checksum && p.checksum !== sha256(JSON.stringify(p.records)).slice(0, 32))
    return { ok:false, erro:'A verificação de integridade falhou: o arquivo foi alterado ou está corrompido.' };
  var atuais = {}, conf = 0;
  listarRegistros().forEach(function (r) { atuais[r.id] = 1; });
  p.records.forEach(function (r) { if (atuais[r.id]) conf++; });
  return { ok:true, payload:p, total:p.records.length, conflitos:conf };
}
function restaurarBackup(p, modo) {
  var atuais = {}, ins = 0, att = 0, ign = 0, arr = listarRegistros();
  arr.forEach(function (r) { atuais[r.id] = r; });
  p.records.forEach(function (r) {
    var ex = atuais[r.id];
    if (!ex) { arr.push(r); ins++; return; }
    if (modo === 'somente_novos') { ign++; return; }
    if (new Date(r.editadoEm) > new Date(ex.editadoEm)) {
      arr[arr.indexOf(ex)] = r; att++;
    } else ign++;
  });
  dbGravar(DB_KEY, arr);
  return { inseridos:ins, atualizados:att, ignorados:ign };
}

/* ------------------------------------------------------------- login ----- */
function bindLogin() {
  $('#formLogin').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('#formLogin button[type=submit]'), box = $('#loginErro'), r;
    btn.disabled = true; btn.textContent = 'Entrando…';
    try {
      r = login($('#inUser').value, $('#inSenha').value, $('#inManter').checked);
      if (!r.ok) { box.textContent = r.erro; box.classList.add('on'); return; }
      box.classList.remove('on');
      S.sessao = r.sessao;
      entrar();
    } catch (err) {
      box.innerHTML = 'Falha ao entrar: ' + esc(err.message);
      box.classList.add('on');
      if (window.console) console.error('[FAT]', err);
    } finally {
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  });
}

function entrar() {
  $('#quemSou').textContent = S.sessao.nome;
  $('#meuPapel').textContent = S.sessao.supervisor
    ? 'Supervisão · ' + S.sessao.totalFazendas + ' fazenda(s) na base'
    : S.sessao.entradaLivre ? 'Sem fazendas vinculadas · entrada livre'
    : S.sessao.totalFazendas + ' fazenda(s) vinculada(s)';
  tela('painel');
  try { carregarPainel(); }
  catch (e) {
    $('#listaLanc').innerHTML = '<p class="vazio">Não foi possível ler os lançamentos salvos.<br><small>' +
      esc(e.message) + '</small></p>';
    if (window.console) console.error('[FAT]', e);
  }
}

function carregarPainel() {
  S.lista = registrosDoConsultor(S.sessao.user);
  renderFazendas();
  renderLancamentos();
}

  var box = $('#listaFazendas'), termo = $('#buscaFazenda').value, fs, total;

    box.appendChild(el('p','vazio','Seu usuário não possui fazendas vinculadas na base. ' +
      'Use <strong>Nova avaliação (entrada livre)</strong> para informar o produtor manualmente.'));

  }
  total = buscarFazendas(S.sessao.nome, termo);

  fs.forEach(function (v) {

    c.innerHTML = '<span class="fzNome">' + esc(v.propriedade) + '</span>' +
      '<span class="fzProd">' + esc(v.produtor) + '</span>' +
      '<span class="fzMeta">' + esc(v.municipio) + ' · ' + esc(v.estado) + ' · ' + esc(v.areaHa || '?') + ' ha</span>' +
      '<span class="fzTags"><em>' + esc(v.codNescafe) + '</em><em>' + esc(String(v.cafeeira).slice(0,34)) + '</em>' +
      (S.sessao.supervisor && v.ats ? '<em>AT: ' + esc(String(v.ats).slice(0,24)) + '</em>' : '') +
      (bloq ? '<em class="tagBloq">BLOQUEADO</em>' : '') + '</span>';

function renderLancamentos() {
  var box = $('#listaLanc'), cont = { rascunho:0, com_pendencia:0, concluido:0, exportado:0 }, lst, t;
  box.innerHTML = '';

  $('#cPendencia').textContent = cont.com_pendencia;
  $('#cConcluido').textContent = cont.concluido;

    lst = lst.filter(function (r) {
      return String((r.vinculo && r.vinculo.propriedade) || '').toUpperCase().indexOf(t) >= 0 ||
             String((r.vinculo && r.vinculo.produtor) || '').toUpperCase().indexOf(t) >= 0;

    row.innerHTML =
      '<label class="chk"><input type="checkbox" data-id="' + r.id + '"' + (S.sel[r.id] ? ' checked' : '') + '></label>' +
      '<div class="lcInfo"><strong>' + esc((r.vinculo && r.vinculo.propriedade) || '(sem nome)') + '</strong>' +
      '<span>' + esc((r.vinculo && r.vinculo.produtor) || '') + ' · ' + esc((r.vinculo && r.vinculo.municipio) || '') +

      '<span class="lcMeta">Editado em ' + new Date(r.editadoEm).toLocaleString('pt-BR') + '</span></div>' +
      '<div class="lcRes"><b>' + (r.resultado && r.resultado.fatPercent !== null && r.resultado.fatPercent !== undefined
        ? r.resultado.fatPercent + '%' : '—') + '</b><span>' + esc((r.nivel && r.nivel.nivel) || '—') + '</span></div>' +
      '<span class="badge b-' + r.status + '">' + rot + '</span>' +

      '<button data-a="xlsx">XLSX</button><button data-a="dup">Duplicar</button>' +
      '<button data-a="del" class="danger">Excluir</button></div>';
    row.querySelector('input').onchange = function (e) {

    };
    var bs = row.querySelectorAll('[data-a]'), i;
    for (i = 0; i < bs.length; i++)
      (function (b) { b.onclick = function () { acaoLanc(b.getAttribute('data-a'), r); }; })(bs[i]);
    box.appendChild(row);
  });
}

function acaoLanc(a, r) {
  var nome = String((r.vinculo && r.vinculo.propriedade) || 'registro').replace(/[^\w]+/g,'_');
  if (a === 'abrir') { S.reg = r; S.secao = 0; abrirForm(); return; }
  if (a === 'pdf') { imprimirRelatorios([r]); marcarExportado([r]); return; }
  if (a === 'xlsx') { baixar(gerarXLSX([r]), 'FAT_' + nome + '.xlsx'); marcarExportado([r]); return; }
  if (a === 'dup') {
    var n = novoRegistro(S.sessao, r.vinculo, r.entradaLivre);
    n.respostas = JSON.parse(JSON.stringify(r.respostas));
    n.fertilizantes = JSON.parse(JSON.stringify(r.fertilizantes || []));
    n.entrevistado = r.entrevistado; n.anoReferencia = r.anoReferencia;
    salvar(n); carregarPainel();
    aviso('Lançamento duplicado como novo rascunho. Revise a data da coleta.');
    return;
  }
  if (a === 'del') {
    if (!confirm('Excluir definitivamente o lançamento da fazenda "' + ((r.vinculo && r.vinculo.propriedade) || '') +
      '" (produtor ' + ((r.vinculo && r.vinculo.produtor) || '') + ')?\n\nEsta ação não pode ser desfeita.')) return;
    if (!confirm('Confirme novamente para evitar exclusão acidental.')) return;
    excluirRegistro(r.id); delete S.sel[r.id];
    carregarPainel(); aviso('Lançamento excluído.','alerta');
  }
}

function marcarExportado(regs) {
  regs.forEach(function (r) {
    if (r.status === 'concluido') { r.status = 'exportado'; r.editadoEm = new Date().toISOString(); gravarRegistro(r); }
  });
  carregarPainel();
}

function secoesUI() {

}
function renderAbas() {
  var box = $('#abas'), secs = secoesUI(), tot, feito;
  box.innerHTML = '';
  secs.forEach(function (s, i) {
    var b = el('button','aba' + (i === S.secao ? ' on' : ''), esc(s.nome));

    box.appendChild(b);
  });

  feito = tot - ((S.reg.resultado && S.reg.resultado.pendentes && S.reg.resultado.pendentes.length) || 0);
  $('#progBar').style.width = Math.round(feito / tot * 100) + '%';

function renderSecao() {
  var box = $('#campos'), secs = secoesUI(), cur = secs[S.secao], itens, subAtual = null;
  box.innerHTML = '';
  if (cur.id === 'ident') { renderIdent(box); ajustarNav(secs); return; }
  if (cur.id === 'resumo') { renderResumo(box); ajustarNav(secs); return; }

  itens = ITEMS.filter(function (i) { return i.section === cur.id; });
  itens.forEach(function (it) {
    if (it.sub && it.sub !== subAtual) { subAtual = it.sub; box.appendChild(el('h3','sub', esc(subAtual))); }
    if (it.type === 'group') {
      box.appendChild(el('div','grupoTit','<strong>' + esc(it.code) + ' · ' + esc(it.text) + '</strong>' +
        (it.obs ? '<span>' + esc(it.obs) + '</span>' : '')));
      return;
    }
    if (it.type === 'repeater') { box.appendChild(repetidorFert()); return; }
    if (!visivel(it, S.reg.respostas)) return;
    if (it.type === 'irrig') { box.appendChild(painelIrrigacao()); return; }
    box.appendChild(campo(it));
  });
  ajustarNav(secs);
}
function ajustarNav(secs) {

function campo(it) {
  var r = S.reg, val = r.respostas[it.id], d = el('div','campo'), ctrl = '', k, cv, a, est, erro, i, ops, n, t, u;
  est = r.resultado && r.resultado.itens && r.resultado.itens[it.id];
  erro = (r.validacao && r.validacao.itens || []).filter(function (x) { return x.campo === it.id; })[0];

  if (it.type === 'yesno' || it.type === 'single') {
    ctrl = '<div class="ops">' + it.options.map(function (o) {
      return '<button class="op' + (val === o ? ' on' : '') + '" data-v="' + esc(o) + '">' + esc(o) + '</button>';
    }).join('') + '</div>';
  } else if (it.type === 'number') {
    ctrl = '<div class="numBox"><input type="number" step="any" inputmode="decimal" value="' +
      (val === null || val === undefined ? '' : esc(val)) + '" data-n>' +
      (it.unidade ? '<span class="un">' + esc(it.unidade) + '</span>' : '') + '</div>';
  } else if (it.type === 'calc') {
    k = { pctOrganico:'pctOrganico', pn:'pn', nPond:'nPond', pPond:'pPond', kPond:'kPond',
          qtdTotal:'qtdTotal', fertPrincipal:'fertPrincipal' }[it.formula];
    cv = r.calculados && r.calculados[k];
    ctrl = '<div class="calcBox">' + (cv === null || cv === undefined
      ? '<em>pendente — depende dos campos de origem</em>'
      : '<strong>' + esc(cv) + '</strong>' + (it.unidade ? ' ' + esc(it.unidade) : '')) +
      '<span class="lock">calculado · somente leitura</span></div>';
  } else if (it.type === 'upload') {
    a = (r.anexos || []).filter(function (x) { return x.itemId === it.id; })[0];
    ctrl = '<div class="upBox"><input type="file" accept="image/*" capture="environment" data-up>' +
      (a ? '<span class="fileOk">' + esc(a.nome) + '</span>' : '<span class="fileNo">nenhuma evidência anexada</span>') + '</div>';
  } else {
    ctrl = '<input class="txt" value="' + esc(val || '') + '" data-t>';
  }

  d.innerHTML = '<div class="cbHead"><span class="cod">' + esc(it.code) + '</span>' +
    '<p class="perg">' + esc(it.text) + '</p>' +
    (est && est.estado !== 'pendente' && it.pontua
      ? '<span class="pts ' + est.estado + '">' + (est.estado === 'na' ? 'NA' : est.pontos + ' pt') + '</span>' : '') +
    '</div>' + (it.obs ? '<p class="obs">' + esc(it.obs) + '</p>' : '') + ctrl +
    (it.help ? '<p class="help">' + esc(it.help) + '</p>' : '') +
    (erro ? '<p class="msg ' + erro.severidade + '">' + esc(erro.mensagem) + '</p>' : '');

  ops = d.querySelectorAll('.op');
  for (i = 0; i < ops.length; i++)
    (function (b) { b.onclick = function () { setResp(it, b.getAttribute('data-v')); }; })(ops[i]);
  n = d.querySelector('[data-n]');

function exportarSelecionados(tipo) {
  var regs = S.lista.filter(function (r) { return S.sel[r.id]; }), diag, alvo, msg;
  if (!regs.length) { aviso('Selecione ao menos um lançamento.','alerta'); return; }
  diag = diagnosticar(regs);
  msg = 'Integridade da exportação\n\nSelecionados: ' + diag.selecionados +
    '\nVálidos: ' + diag.validos + '\nCom pendência: ' + diag.comPendencia +
    '\nBloqueados: ' + diag.bloqueados + '\n\n' +
    (diag.detalheBloqueio.length ? 'Motivo do primeiro bloqueio:\n' + diag.detalheBloqueio[0].motivo + '\n\n' : '') +
    'Exportar mesmo assim (inclui os com pendência)?';
  if (!confirm(msg)) return;

  alvo = regs.filter(function (r) { return !(r.validacao && r.validacao.erros && r.validacao.erros.length); });
  if (!alvo.length) { aviso('Nenhum registro elegível: todos possuem erro bloqueante.','erro'); return; }

  if (tipo === 'xlsx') {
    baixar(gerarXLSX(alvo),'FAT_export_' + new Date().toISOString().slice(0,10) + '.xlsx');
    marcarExportado(alvo);
    aviso('XLSX gerado com ' + alvo.length + ' registro(s).');
    return;
  }
  imprimirRelatorios(alvo);
  marcarExportado(alvo);
  aviso(alvo.length + ' relatório(s) enviados à impressão. Escolha "Salvar como PDF".');
}

  var rv = base(); rv.q109 = 50; rv.q110a = 0;
  var vv = validar(rv, f1, calcular(rv, f1));
  T('Dependência 1.09/1.10 gera erro', true, vv.erros.some(function (e) { return e.campo === 'q110a'; }));
  T('Erro bloqueia conclusão', false, vv.podeConcluir);
  T('Fixture completa sem erro', true, validar(base(), f1, calcular(base(), f1)).podeConcluir);

  T('EXPORT com 65 colunas', 65, EXPORT_HEADERS.length);
  var reg = novoRegistro({ user:'T', nome:'TESTE' },
    { codNescafe:'NSCBR0795', propriedade:'FAZENDA AGAPE', unidade4C:'I', produtor:'X' }, false);
  reg.respostas = base(); reg.fertilizantes = f1; recalcular(reg);
  var L = montarLinha(reg);
  function at(C) { return L[colIndex(C) - 1]; }
  T('Linha com 65 células', 65, L.length);
  T('Coluna B = COD NESCAFE','NSCBR0795', at('B').v);
  T('Coluna D = BRASIL','BRASIL', at('D').v);
  T('BG = pontos', 28, at('BG').v);
  T('BH = máximo', 28, at('BH').v);
  T('BI = FAT %', 100, at('BI').v);
  T('BJ = nível','Especialista', at('BJ').v);
  T('BL = sacas', 500, at('BL').v);
  T('BM = produtividade', 50, at('BM').v);
  T('Zero preservado (1.03)','0', at('N').v);
  T('Coluna A é texto','s', at('A').t);

  var regNA = novoRegistro({ user:'T', nome:'TESTE' }, { propriedade:'X' }, true);
  regNA.respostas = base(); regNA.respostas.q301 = 'Não';
  delete regNA.respostas.q303; delete regNA.respostas.q305; delete regNA.respostas.q307;
  recalcular(regNA);
  T('NA exportado como "NA"','NA', montarLinha(regNA)[colIndex('AU') - 1].v);
  T('Entrada livre: coluna B vazia','', montarLinha(regNA)[1].v);

  T('CRC32 de "123456789"', 3421780262, crc32(utf8Bytes('123456789')));
  var blob = gerarXLSX([reg]);
  T('XLSX gerado com tamanho plausível', true, blob.size > 2000);

  var msg = 'Testes: ' + ok + ' aprovados, ' + fail + ' reprovados (total ' + (ok + fail) + ').';
  if (fail) msg += '\n\nFalhas:\n' + falhas.join('\n');
  alert(msg);
  return { ok:ok, fail:fail };
}

/* ==========================================================================
   18. INICIALIZAÇÃO
   ========================================================================== */
function iniciar() {
  bindLogin();
  $('#verForm').textContent = FORM_VERSION;
  $('#btnSair').onclick = function () { logout(); S.sessao = null; S.reg = null; tela('login'); };
  $('#buscaFazenda').oninput = renderFazendas;
  $('#buscaLanc').oninput = function (e) { S.busca = e.target.value; renderLancamentos(); };
  $('#btnVoltar').onclick = function () { carregarPainel(); tela('painel'); };
  $('#btnAnt').onclick = function () { S.secao = Math.max(0, S.secao - 1); renderAbas(); renderSecao(); };
  $('#btnProx').onclick = function () {
    S.secao = Math.min(secoesUI().length - 1, S.secao + 1); renderAbas(); renderSecao();
  };
  $('#btnNovoLivre').onclick = function () {
    abrirNovo({ produtor:'', propriedade:'', municipio:'', estado:'', cafeeira:'' }, true);
  };
  var fs = document.querySelectorAll('[data-filtro]'), i;
  for (i = 0; i < fs.length; i++)
    (function (b) {
      b.onclick = function () {
        S.filtro = b.getAttribute('data-filtro');
        var all = document.querySelectorAll('[data-filtro]'), j;
        for (j = 0; j < all.length; j++) all[j].classList.toggle('on', all[j] === b);
        renderLancamentos();
      };
    })(fs[i]);
  $('#btnSelTodos').onclick = function () {
    var vis = document.querySelectorAll('#listaLanc input[data-id]'), todos = true, j;
    for (j = 0; j < vis.length; j++) if (!vis[j].checked) todos = false;
    for (j = 0; j < vis.length; j++) {
      vis[j].checked = !todos;
      S.sel[vis[j].getAttribute('data-id')] = !todos;
    }
    $('#selInfo').textContent = contarSel() + ' selecionado(s)';
  };
  $('#btnXlsxLote').onclick = function () { exportarSelecionados('xlsx'); };
  $('#btnPdfLote').onclick = function () { exportarSelecionados('pdf'); };
  $('#btnBackup').onclick = function () {
    baixar(exportarBackup(),'FAT_backup_' + new Date().toISOString().slice(0,10) + '.json');
  };
  $('#inRestore').onchange = function (e) {
    var f = e.target.files[0], fr;
    if (!f) return;
    fr = new FileReader();
    fr.onload = function () {
      var v = validarBackup(fr.result), modo, r;
      if (!v.ok) { aviso(v.erro,'erro'); return; }
      modo = v.conflitos
        ? (confirm('O backup contém ' + v.total + ' lançamento(s), sendo ' + v.conflitos +
            ' já existente(s) neste aparelho.\n\nOK = manter sempre a versão mais recente.\n' +
            'Cancelar = importar apenas os que ainda não existem.') ? 'recente' : 'somente_novos')
        : 'somente_novos';
      r = restaurarBackup(v.payload, modo);
      carregarPainel();
      aviso('Restauração: ' + r.inseridos + ' novo(s), ' + r.atualizados + ' atualizado(s), ' +
            r.ignorados + ' ignorado(s).');
    };
    fr.readAsText(f);
    e.target.value = '';
  };
  $('#btnRecalc').onclick = function () {
    if (!confirm('Recalcular todos os lançamentos com as premissas vigentes?')) return;
    var regs = listarRegistros(), alterados = 0;
    regs.forEach(function (r) {
      var antes = JSON.stringify([r.resultado && r.resultado.pontosObtidos,
                                  r.resultado && r.resultado.fatPercent, r.nivel && r.nivel.nivel]);
      recalcular(r);
      var depois = JSON.stringify([r.resultado.pontosObtidos, r.resultado.fatPercent, r.nivel.nivel]);
      if (antes !== depois) { alterados++; auditar(r.id,'recalculo_premissas', antes, depois); }
      r.editadoEm = new Date().toISOString();
    });
    dbGravar(DB_KEY, regs);
    carregarPainel();
    aviso(regs.length + ' lançamento(s) reprocessado(s); ' + alterados + ' com resultado alterado.');
  };
  $('#btnTestes').onclick = rodarTestes;

  var s = sessaoAtual();
  if (s) { try { S.sessao = s; entrar(); } catch (e) { logout(); tela('login'); } }
  else tela('login');
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
else iniciar();

})();
</script>
